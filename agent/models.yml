# bai-gjc-starter — B.AI provider 정의 for gajae-code (gjc).
#
# 메인(default) + 서브에이전트 전부 B.AI 키 하나(BAI_API_KEY)로 쓴다. OpenAI 호환 /v1/chat/completions.
# 이 파일에는 비밀정보가 없다. 키는 환경변수 "이름"(apiKeyEnv)으로만 참조한다.
#
# cost = 2026-10-15 기준 "이벤트 적용 후 실제 단가"(USD / 1M 토큰). gjc 화면의 비용 표시가 실제 청구에 가깝도록.
#   표준가와 할인율은 각 모델 위 주석. 이벤트가 바뀌면 청구는 B.AI 화면이 기준이다.
#   최신 이벤트: https://docs.b.ai/llmservice/promotions-and-pricing-notices/
# 모델 id 확인:  curl https://api.b.ai/v1/models -H "Authorization: Bearer $BAI_API_KEY"
# 여기 없는 B.AI 모델(GPT·Claude 등 고가)도 gjc가 /v1/models로 자동으로 불러온다. 비용 0으로 보일 수 있으니 주의.

providers:
  bai:
    baseUrl: https://api.b.ai/v1
    apiKeyEnv: BAI_API_KEY
    api: openai-completions
    models:
      # MiMo-V2.6-Flash — 표준 $0.14 / $0.28 → 10% 과금(90% 할인, 9/25~)
      - id: mimo-v2.6-flash
        name: MiMo-V2.6-Flash · B.AI (90% 할인)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 131072
        cost: { input: 0.014, output: 0.028, cacheRead: 0.00028, cacheWrite: 0.014 }

      # Qwen3.8-Flash — 표준 $0.16 / $0.47 → 30% 과금(70% 할인, 9/25~. 이전 90% 할인에서 축소)
      - id: qwen3.8-flash
        name: Qwen3.8-Flash · B.AI (70% 할인)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 131072
        cost: { input: 0.048, output: 0.141, cacheRead: 0.0048, cacheWrite: 0.048 }

      # MiMo-V2.6-Pro — 표준 $0.435 / $0.87 → 50% 과금(50% 할인, 9/25~)
      - id: mimo-v2.6-pro
        name: MiMo-V2.6-Pro · B.AI (50% 할인)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 131072
        cost: { input: 0.2175, output: 0.435, cacheRead: 0.0018, cacheWrite: 0.2175 }

      # DeepSeek-V4.1-Flash — 표준 피크 $0.30 / $1.20, 비피크 절반 → 60% 과금(40% 할인, 10/4~. 이전 90% 할인에서 축소)
      #   cost는 피크 기준(보수적). 비피크(베이징 평일 09-12·14-18시 외, 한국 시간 평일 10-13·15-19시 외)는 이 값의 절반.
      - id: deepseek-v4.1-flash
        name: DeepSeek-V4.1-Flash · B.AI (40% 할인)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 65536
        cost: { input: 0.18, output: 0.72, cacheRead: 0.0036, cacheWrite: 0.18 }

      # GLM-5.3-Flash — 표준 $0.15 / $0.50 → 70% 과금(30% 할인, 10/4~. 이전 90% 할인에서 축소)
      - id: glm-5.3-flash
        name: GLM-5.3-Flash · B.AI (30% 할인)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 65536
        cost: { input: 0.105, output: 0.35, cacheRead: 0.021, cacheWrite: 0.105 }

      # GLM-5.3 — 표준 $1.40 / $4.40 → 90% 과금(10% 할인)
      - id: glm-5.3
        name: GLM-5.3 · B.AI (10% 할인)
        reasoning: true
        input: [text]
        contextWindow: 200000
        maxTokens: 65536
        cost: { input: 1.26, output: 3.96, cacheRead: 0.252, cacheWrite: 1.26 }
